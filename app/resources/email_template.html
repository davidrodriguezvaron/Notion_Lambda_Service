<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<meta name="x-apple-disable-message-reformatting">
<title>{{subject}}</title>
<style>
  :root { color-scheme: light dark; supported-color-schemes: light dark; }
  body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
  a { text-decoration: none; }
  @media screen and (max-width: 480px) {
    .px { padding-left: 16px !important; padding-right: 16px !important; }
    .h1 { font-size: 22px !important; }
    .count { font-size: 22px !important; }
  }
  @media (prefers-color-scheme: dark) {
    .bg-page { background-color: #0f1113 !important; }
    .bg-card { background-color: #181b1f !important; }
    .txt { color: #e7e9ec !important; }
    .txt-muted { color: #9aa1a9 !important; }
    .line { border-color: #2a2f35 !important; }
    .card-neutral { background-color: #22262b !important; }
    .card-alert { background-color: #3a1d1f !important; }
    .txt-alert { color: #ff8f8f !important; }
    .txt-blue { color: #8ab4ff !important; }
    .rail-red { border-left-color: #a8474a !important; }
    .rail-blue { border-left-color: #4c7fd9 !important; }
    .rail-gray { border-left-color: #4a5058 !important; }
    .link { color: #8ab4ff !important; }
    .card-ok { background-color: #12261b !important; }
    .txt-ok { color: #75e0a7 !important; }
{{dark_area_css}}
  }
</style>
</head>
<body class="bg-page" style="margin:0;padding:0;background-color:#f3f4f6;">
<div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">{{preheader}}&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;</div>
<table role="presentation" class="bg-page" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f4f6;">
<tr>
<td align="center" style="padding:24px 8px;">
<table role="presentation" class="bg-card" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<tr>
<td class="px" style="padding:28px 28px 8px 28px;">
<div class="txt-muted" style="font-size:12px;line-height:16px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#6b7280;">Tareas</div>
<div class="txt h1" style="font-size:24px;line-height:30px;font-weight:700;color:#111827;margin-top:4px;">{{date_label}}</div>
</td>
</tr>
{{counters}}
{{sections}}
{{footer}}
</table>
</td>
</tr>
</table>
</body>
</html>
