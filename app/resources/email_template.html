<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<meta name="x-apple-disable-message-reformatting">
<title>{{subject}}</title>
<style>
  :root { color-scheme: light dark; supported-color-schemes: light dark; }
  body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
  a { text-decoration: none; }
  @media screen and (max-width: 480px) {
    .px { padding-left: 22px !important; padding-right: 22px !important; }
    .gutter { padding: 0 !important; }
    .paper { border-left: 0 !important; border-right: 0 !important; }
    .numeral { font-size: 64px !important; line-height: 60px !important; }
    .weekday { font-size: 24px !important; line-height: 28px !important; }
    .stat { font-size: 28px !important; line-height: 32px !important; }
    .task { font-size: 17px !important; line-height: 23px !important; }
  }
  /* "Papel de noche": warm dark paper and cream ink, never pure black. */
  @media (prefers-color-scheme: dark) {
    .page { background-color: #17130f !important; }
    .paper { background-color: #221c17 !important; border-color: #3d342c !important; }
    .ink { color: #efe6d8 !important; }
    .body { color: #ddd2c3 !important; }
    .muted { color: #a89a8b !important; }
    .accent { color: #e0915e !important; }
    .red { color: #ff8f7a !important; }
    .rule { border-color: #3d342c !important; }
    .rule-ink { border-color: #8a7b6e !important; }
    .dot { border-color: #4a3f36 !important; }
    .note { background-color: #2c241e !important; border-left-color: #e0915e !important; }
    .note-red { background-color: #2e1f1c !important; border-left-color: #ff8f7a !important; }
    .box { border-color: #e0915e !important; }
    .box-red { border-color: #ff8f7a !important; }
{{dark_area_css}}
  }
</style>
</head>
<body class="page" style="margin:0;padding:0;background-color:#efe7da;">
<div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">{{preheader}}&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;</div>
<table role="presentation" class="page" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#efe7da;">
<tr>
<td class="gutter" align="center" style="padding:28px 12px;">
<table role="presentation" class="paper" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background-color:#fbf7f0;border:1px solid #e3d8c6;font-family:Georgia,'Times New Roman',serif;color:#3b2f2a;">
{{body}}
</table>
</td>
</tr>
</table>
</body>
</html>
