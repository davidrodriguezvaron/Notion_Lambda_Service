<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<meta name="x-apple-disable-message-reformatting">
<title>{{subject}}</title>
<style>
  :root { color-scheme: light dark; supported-color-schemes: light dark; }
  body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
  a { text-decoration: none; }
  @media screen and (max-width: 480px) {
    .px { padding-left: 18px !important; padding-right: 18px !important; }
    .h1 { font-size: 20px !important; line-height: 26px !important; }
    .count { font-size: 24px !important; line-height: 28px !important; }
    .gutter { padding-left: 0 !important; padding-right: 0 !important; }
    .card { border-radius: 0 !important; border-left: 0 !important; border-right: 0 !important; }
  }
  @media (prefers-color-scheme: dark) {
    .bg-page { background-color: #0b0d10 !important; }
    .card { background-color: #15181d !important; border-color: #262a31 !important; }
    .txt { color: #e8eaed !important; }
    .txt-muted { color: #9aa3ae !important; }
    .txt-faint { color: #6b7380 !important; }
    .line { border-color: #262a31 !important; }
    .tile { background-color: #e8eaed !important; }
    .tile-month { color: #4b5563 !important; }
    .tile-day { color: #0f172a !important; }
    .box { background-color: #15181d !important; border-color: #262a31 !important; }
    .soft-red { background-color: #2a1416 !important; }
    .soft-blue { background-color: #121f36 !important; }
    .soft-slate { background-color: #1d2127 !important; }
    .soft-green { background-color: #0f2418 !important; border-color: #1b4d31 !important; }
    .fg-red { color: #ff9b9b !important; }
    .fg-blue { color: #93b8ff !important; }
    .fg-slate { color: #b6bec8 !important; }
    .fg-green { color: #7ee2a8 !important; }
    .rail-red { border-left-color: #b54a4f !important; }
    .rail-blue { border-left-color: #4b7fe0 !important; }
    .rail-slate { border-left-color: #4a515b !important; }
    .bar-red { border-top-color: #b54a4f !important; }
    .bar-blue { border-top-color: #4b7fe0 !important; }
    .bar-slate { border-top-color: #4a515b !important; }
    .dot-red { background-color: #ff9b9b !important; }
    .dot-blue { background-color: #93b8ff !important; }
    .dot-slate { background-color: #b6bec8 !important; }
    .ring { border-color: #4a515b !important; }
    .btn { background-color: #e8eaed !important; }
    .btn-txt { color: #0f172a !important; }
    .link { color: #93b8ff !important; }
{{dark_area_css}}
  }
</style>
</head>
<body class="bg-page" style="margin:0;padding:0;background-color:#eef0f4;">
<div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">{{preheader}}&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;</div>
<table role="presentation" class="bg-page" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#eef0f4;">
<tr>
<td class="gutter" align="center" style="padding:28px 12px;">
<table role="presentation" class="card" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background-color:#ffffff;border:1px solid #e3e6eb;border-radius:18px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
{{header}}
{{counters}}
{{sections}}
{{footer}}
</table>
</td>
</tr>
</table>
</body>
</html>
